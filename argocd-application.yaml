apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: postgres-rag-ollama

  namespace: argocd

spec:

  project: default

  source:
    repoURL: https://github.com/muskan7860/postgres-rag-ollama-gitops.git
    targetRevision: main
    path: .

  destination:
    server: https://kubernetes.default.svc
    namespace: rag-app

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true