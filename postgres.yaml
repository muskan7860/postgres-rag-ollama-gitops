apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-rag-db
  namespace: rag-app
  labels:
    app: postgres-rag-db

spec:
  replicas: 1

  selector:
    matchLabels:
      app: postgres-rag-db

  template:
    metadata:
      labels:
        app: postgres-rag-db

    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:pg16

          ports:
            - containerPort: 5432

          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-rag-secret
                  key: POSTGRES_DB

            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-rag-secret
                  key: POSTGRES_USER

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-rag-secret
                  key: POSTGRES_PASSWORD

          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data

      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-rag-pvc

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-rag-pvc
  namespace: rag-app

spec:
  accessModes:
    - ReadWriteOnce

  resources:
    requests:
      storage: 5Gi