apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-rag-ollama
  namespace: rag-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: postgres-rag-ollama

  template:
    metadata:
      labels:
        app: postgres-rag-ollama

    spec:
      containers:
        - name: app

          image: docker.io/muskanpatel71198/postgres-rag-ollama:32

          ports:
            - containerPort: 8000

          env:
            - name: APP_ENV
              value: "production"

            - name: APP_PORT
              value: "8000"

            - name: POSTGRES_HOST
              value: "postgres-rag-db"

            - name: POSTGRES_PORT
              value: "5432"

            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-rag-secret
                  key: POSTGRES_DB

            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-rag-secret
                  key: POSTGRES_USER

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-rag-secret
                  key: POSTGRES_PASSWORD

            - name: OLLAMA_HOST
              value: "http://ollama:11434"

            - name: OLLAMA_MODEL
              value: "llama3.2:3b"

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20